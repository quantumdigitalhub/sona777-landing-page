name: Deploy Raja 567 to Cloudflare Pages

on:
  push:
    branches: [raja-567]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-raja567-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/raja-567'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.2"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test and check types
        run: |
          npm test
          npx tsc --noEmit
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.RAJA567_VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.RAJA567_VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build
      - name: Deploy production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing repository variable CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing repository secret CLOUDFLARE_API_TOKEN"; exit 1; }
          npx wrangler pages deploy dist --project-name raja567-landing --branch raja-567 --commit-hash "$GITHUB_SHA"
